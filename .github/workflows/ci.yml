name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: python3 --version
      - run: npm ci
      - run: npm run check
      - name: Ensure Git installs ship the current prebuilt modules
        run: |
          git ls-files --error-unmatch lib/index.js lib/client.js lib/literature.py
          git diff --exit-code -- lib
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - run: npm run test:install
      - run: npm pack
