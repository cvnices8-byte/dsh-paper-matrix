name: Package release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.1
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build installable archive and checksum
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS.txt
      - name: Attach package to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
